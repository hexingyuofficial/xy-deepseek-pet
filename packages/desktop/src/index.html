<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; style-src 'self'; script-src 'self'" />
    <title>XY DeepSeek Pet</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="app" aria-label="XY DeepSeek Pet">
      <section id="bubble-stack" class="bubble-stack is-hidden" aria-live="polite"></section>

      <div id="toast" class="toast is-hidden" role="status"></div>

      <nav id="pixel-menu" class="pixel-menu is-hidden" aria-label="桌宠菜单">
        <button type="button" data-menu-action="open-client" data-i18n="openClient">打开客户端</button>
        <button type="button" data-menu-action="chat" data-i18n="reply">回复最近活跃消息</button>
        <button id="menu-settings" type="button" data-menu-action="settings" data-i18n="themesSettings">在 Harness 中打开设置</button>
        <button id="menu-reconnect" class="is-hidden" type="button" data-menu-action="reconnect" data-i18n="reconnect">检查连接</button>
        <button type="button" data-menu-action="quit" data-i18n="quitPet">关闭桌宠</button>
      </nav>

      <button id="pet-stage" type="button" aria-label="XY DeepSeek Pet" title="XY DeepSeek Pet">
        <canvas id="pet-canvas" width="192" height="208"></canvas>
        <span id="attention-badge" class="attention-badge is-hidden" aria-label="Needs attention">!</span>
      </button>
    </main>
    <script type="module" src="./renderer.js"></script>
  </body>
</html>
